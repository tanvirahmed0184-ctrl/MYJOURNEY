<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
      body {
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .glow {
        font-size: 200px;
        color: rgba(255, 72, 0, 0.701);
        font-family: "Poppins", sans-serif;
        text-transform: uppercase;
        text-shadow: 0 0 10px #ff8800, 0 0 20px #ff0d00, 0 0 40px #ff3300,
          0 0 80px #ff5900;
        animation: pulse 2s infinite alternate;
      }

      @keyframes pulse {
        from {
          text-shadow: 0 0 5px #ff5e00, 0 0 10px #ff0000, 0 0 20px #ff0000,
            0 0 40px #ff0000;
        }
        to {
          text-shadow: 0 0 20px #ff3c00, 0 0 40px #ff0000, 0 0 80px #ff2200,
            0 0 120px #ff0000;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="glow">Login</h1>
  </body>
</html>
