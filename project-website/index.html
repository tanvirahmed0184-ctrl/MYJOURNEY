<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Name - New Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-pink': '#FFD1D1',
                        'brand-rose': '#D87D88',
                        'brand-bg': '#F5F5F7',
                        'brand-cream': '#FDF0F0', // For the bottom section background
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for things Tailwind is too verbose for */
        .collage-img {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
        }
        .collage-img:hover {
            z-index: 50;
            transform: scale(1.05) rotate(0deg) !important;
        }
    </style>
</head>
<body class="bg-brand-cream overflow-x-hidden">

    <!-- Header -->
    <header class="bg-brand-pink py-4 px-6 md:px-12 flex justify-between items-center fixed w-full top-0 z-50">
        <div class="text-xl md:text-2xl font-bold tracking-tight text-black">BRAND NAME</div>
        
        <div class="flex items-center space-x-6">
            <a href="#" class="font-semibold text-black hover:opacity-70 hidden md:block">Explore</a>
            <button class="hover:opacity-70">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
            <button class="relative hover:opacity-70">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span class="absolute -top-1 -right-1 bg-black text-white text-xs font-bold rounded-full h-4 w-4 flex items-center justify-center">1</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="pt-20 md:pt-24 min-h-screen bg-brand-bg relative overflow-hidden">
        <div class="container mx-auto px-6 md:px-12 grid grid-cols-1 md:grid-cols-2 gap-12 items-center h-full pb-20">
            
            <!-- Left Content -->
            <div class="z-10 mt-10 md:mt-0 relative">
                <h1 class="text-6xl md:text-7xl lg:text-8xl font-bold text-black leading-tight mb-6">
                    Your New <br>
                    Favorites <br>
                    Have Arrived
                </h1>
                <p class="text-gray-600 text-lg md:text-xl max-w-lg mb-12 leading-relaxed">
                    Small-batch production. Ethically sourced. Built to last longer than a season. Limited pieces, infinite impact.
                </p>
                
                <div class="relative inline-block">
                    <button class="bg-brand-rose text-black font-bold py-4 px-8 text-lg border-2 border-transparent shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-y-1 hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all duration-200">
                        Explore the <br> Collection
                    </button>
                    
                    <!-- Hand drawn arrow SVG -->
                    <svg class="absolute -bottom-16 -right-16 w-16 h-16 md:w-20 md:h-20 text-black transform rotate-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                         <path d="M20,10 Q50,5 80,40 T60,90" stroke="currentColor" stroke-width="3" fill="none" />
                         <path d="M60,90 L70,80 M60,90 L50,80" stroke="currentColor" stroke-width="3" fill="none" />
                    </svg>
                </div>
            </div>

            <!-- Right Content - The Collage -->
            <div class="relative h-[500px] md:h-[700px] w-full hidden md:block">
                <!-- Background decorative blob/shape -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] bg-white rounded-full blur-3xl opacity-50 -z-10"></div>

                <!-- Clothes Rack / Top Right -->
                <div class="absolute top-0 right-0 w-64 h-80 collage-img transform rotate-6 bg-white p-2">
                    <img src="https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Clothes rack" class="w-full h-full object-cover">
                </div>

                <!-- Mobile UI / Center Right -->
                <div class="absolute top-1/3 right-20 w-56 h-96 collage-img transform -rotate-12 z-20 bg-white p-1 rounded-2xl border-4 border-gray-100">
                    <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Mobile App" class="w-full h-full object-cover rounded-xl">
                    <!-- Overlay to simulate UI lines if needed, keeping it simple with just image for now -->
                    <div class="absolute inset-0 bg-white opacity-20 pointer-events-none"></div>
                </div>

                <!-- Flat lay / Bottom Center -->
                <div class="absolute bottom-10 left-10 w-72 h-72 collage-img transform -rotate-6 z-10 bg-white p-2">
                    <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Fashion Flatlay" class="w-full h-full object-cover">
                </div>
                
                <!-- Another UI element floating -->
                <div class="absolute top-20 left-10 w-48 h-64 collage-img transform rotate-12 z-0 opacity-80 bg-white p-2">
                     <img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Fashion Detail" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Section - Full Width Image -->
    <section class="w-full bg-brand-cream relative">
        <div class="w-full h-[600px] md:h-[800px] overflow-hidden relative">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80" alt="Woman in Blazer" class="w-full h-full object-cover object-top">
            
            <!-- Optional overlay if needed to match the 'pinkish' hue of the bottom area in original image if it's not just the bg color -->
            <div class="absolute inset-0 bg-brand-rose mix-blend-overlay opacity-10"></div>
        </div>
    </section>

    <!-- Footer Simple -->
    <footer class="bg-brand-pink py-8 text-center">
        <p class="font-semibold">&copy; 2024 Brand Name. All rights reserved.</p>
    </footer>

    <script>
        // Simple interactivity
        document.querySelector('button.shadow-\\[4px_4px_0px_0px_rgba\\(0\\,0\\,0\\,1\\)\\]').addEventListener('click', () => {
            alert('Exploring collection...');
            document.querySelector('section').scrollIntoView({behavior: 'smooth'});
        });
    </script>
</body>
</html>
